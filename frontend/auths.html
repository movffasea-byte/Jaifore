<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Auth</title>
  <link rel="stylesheet" href="styles/auths.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="page">
 
    <header class="topbar">
      <a href="#" class="nav-logo">
        <img src="logo/rooted2.jpg" alt="Jaifore" />
    </a>
    </header>
 
    <div class="main">
 
      <!-- LEFT -->
      <div class="left">
        <div>
          <h1 class="headline">
            We make<br/>
            <em>ideas</em><br/>
            <span class="outline">visible.</span>
          </h1>
          <p class="desc">A multinational creative studio building brands through apparel, design, and code.</p>
        </div>
        <div class="services">
          <div class="service-item"><span class="service-num">01</span> Custom Apparel Printing</div>
          <div class="service-item"><span class="service-num">02</span> Graphic Design</div>
          <div class="service-item"><span class="service-num">03</span> Web Development</div>
        </div>
      </div>
 
      <!-- RIGHT -->
      <div class="right">
        <h2 class="form-title">Welcome.</h2>
        <p class="form-subtitle">Sign in to your account or create a new one.</p>
 
        <div class="tabs">
          <button class="tab active" data-tab="login">Sign In</button>
          <button class="tab" data-tab="register">Register</button>
        </div>
 
        <!-- LOGIN -->
        <form class="auth-form active" id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required/>
            <span class="toggle-pw" data-target="login-password">Show</span>
          </div>
          <div class="form-footer">
            <a href="#" class="forgot">Forgot password?</a>
          </div>
          <button type="submit" class="btn-primary">
            <span class="btn-text">Log In</span>
            <span class="btn-loader hidden"></span>
          </button>
          <p class="msg" id="login-msg"></p>
        </form>
 
        <!-- REGISTER -->
        <form class="auth-form" id="register-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="Your name" required/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Min. 8 characters" required/>
            <span class="toggle-pw" data-target="reg-password">Show</span>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="reg-confirm" placeholder="Repeat password" required/>
          </div>
          <button type="submit" class="btn-primary">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader hidden"></span>
          </button>
          <p class="msg" id="register-msg"></p>
        </form>
 
      </div>
    </div>
  </div>

  <script src="scripts/auths.js"></script>

</body>
</html>
