<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jai'fore — Design Studio</title>
  <link rel="stylesheet" href="styles/services.css"/>
  <link rel="stylesheet" href="styles/configurator.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="noise"></div>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <img src="logo/rooted2.jpg" alt="Jai'fore"/>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="loginsys.html" class="nav-cta">Sign In</a>
    </div>
  </nav>

  <!-- STUDIO -->
  <main class="studio">

    <!-- LEFT: CANVAS -->
    <div class="studio-canvas-wrap">

      <!-- View Toggle -->
      <div class="view-toggle">
        <button class="view-btn active" data-view="front">Front</button>
        <button class="view-btn" data-view="back">Back</button>
        <button class="view-btn" data-view="side">Side</button>
      </div>

      <!-- Product Name -->
      <div class="studio-product-name" id="studioProductName">Loading...</div>

      <!-- Canvas -->
      <div class="canvas-outer">
        <div class="canvas-container" id="canvasContainer">
          <!-- Merch mockup -->
          <img class="merch-mockup" id="merchMockup" src="" alt="Merch"/>

          <!-- Preset zones -->
          <div class="zone zone-chest" id="zoneChest" title="Chest zone">
            <span>Chest</span>
          </div>
          <div class="zone zone-back" id="zoneBack" title="Back zone" style="display:none">
            <span>Back</span>
          </div>
          <div class="zone zone-side" id="zoneSide" title="Side zone" style="display:none">
            <span>Side</span>
          </div>

          <!-- Design layers will be injected here -->
        </div>
      </div>

      <!-- Canvas actions -->
      <div class="canvas-actions">
        <button class="ca-btn" id="undoBtn">↩ Undo</button>
        <button class="ca-btn" id="clearBtn">✕ Clear All</button>
        <button class="ca-btn danger" id="removeBtn">🗑 Remove Selected</button>
      </div>

    </div>

    <!-- RIGHT: PANEL -->
    <div class="studio-panel">

      <!-- Step 1: Merch info -->
      <div class="panel-section">
        <div class="panel-label">Selected Merch</div>
        <div class="panel-merch-info" id="panelMerchInfo">
          <div class="panel-merch-name" id="panelMerchName">—</div>
          <div class="panel-merch-price" id="panelMerchPrice">—</div>
        </div>
      </div>

      <!-- Step 2: Design count -->
      <div class="panel-section">
        <div class="panel-label">Designs Applied <span class="design-count" id="designCount">0 / 5</span></div>
        <div class="design-slots" id="designSlots"></div>
      </div>

      <!-- Step 3: Pick from Jaifore designs -->
      <div class="panel-section">
        <div class="panel-label">Jaifore Graphic Designs</div>
        <div class="graphic-grid" id="graphicGrid">
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
        </div>
      </div>

      <!-- Step 4: Upload own image -->
      <div class="panel-section">
        <div class="panel-label">Upload Your Own Design</div>
        <label class="upload-zone" id="uploadZone">
          <input type="file" id="uploadInput" accept="image/*" hidden/>
          <div class="upload-icon">↑</div>
          <div class="upload-text">Click to upload<br/><span>PNG, JPG, SVG — max 5MB</span></div>
        </label>
      </div>

      <!-- Step 5: Size -->
      <div class="panel-section">
        <div class="panel-label">Select Size</div>
        <div class="size-row" id="sizeRow">
          <button class="sz-btn" data-size="XS">XS</button>
          <button class="sz-btn" data-size="S">S</button>
          <button class="sz-btn" data-size="M">M</button>
          <button class="sz-btn" data-size="L">L</button>
          <button class="sz-btn" data-size="XL">XL</button>
          <button class="sz-btn" data-size="XXL">XXL</button>
        </div>
      </div>

      <!-- Step 6: Notes -->
      <div class="panel-section">
        <div class="panel-label">Design Notes <span style="color:#aaa;font-weight:400">(optional)</span></div>
        <textarea class="design-notes" id="designNotes" placeholder="Any special instructions for the print team..." rows="3"></textarea>
      </div>

      <!-- Add to Cart -->
      <button class="add-to-cart-btn" id="addToCartBtn">
        Add to Cart — <span id="cartBtnPrice">₦0</span>
      </button>
      <p class="studio-msg" id="studioMsg"></p>

    </div>
  </main>


  <script src="scripts/currency.js"></script>
  <script src="data/cart.js"></script>
  <script src="scripts/configurator.js"></script>
</body>
</html>
