<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jai'fore — Design Studio</title>
  <link rel="stylesheet" href="styles/services.css"/>
  <link rel="stylesheet" href="styles/configurator.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Karla:wght@300;400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet"/>

  <style>
    /* ── GENDER MODAL ─────────────────────────────── */
    #genderModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #genderModal.visible  { opacity: 1; }
    #genderModal.fade-out { opacity: 0; }

    .gender-modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      width: min(380px, 90vw);
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      transform: translateY(0);
    }
    .gender-modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.4rem;
    }
    .gender-modal-sub {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2rem;
    }
    .gender-modal-options {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .gender-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.2rem 2rem;
      border: 2px solid #e8e8e8;
      border-radius: 14px;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Karla', sans-serif;
    }
    .gender-opt:hover {
      border-color: #7b5ea7;
      background: #f3eeff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(123,94,167,0.15);
    }
    .gender-icon  { font-size: 2rem; }
    .gender-label { font-size: 0.9rem; font-weight: 600; color: #1a1a2e; }

    /* ── GENDER TOGGLE (in studio) ───────────────── */
    .gender-toggle {
      display: flex;
      gap: 0.4rem;
      background: #f0f0f0;
      border-radius: 10px;
      padding: 3px;
    }
    .gender-btn {
      padding: 0.3rem 0.9rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: 'Karla', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .gender-btn.active {
      background: #7b5ea7;
      color: #fff;
      box-shadow: 0 2px 8px rgba(123,94,167,0.3);
    }
    .gender-btn:hover:not(.active) { background: #e0e0e0; color: #333; }

    /* ── TOGGLE ROW ──────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="noise"></div>

  <!-- NAV -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <img src="logo/rooted2.jpg" alt="Jai'fore"/>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
    </div>
    <div class="nav-right">
      <div id="nav-actions"></div>
      <button class="cart-btn" id="cart-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </nav>

  <!-- STUDIO -->
  <main class="studio">

    <!-- LEFT: CANVAS -->
    <div class="studio-canvas-wrap">

      <div class="toggle-row">
        <div class="view-toggle">
          <button class="view-btn active" data-view="front">Front</button>
          <button class="view-btn" data-view="back">Back</button>
        </div>
        <div class="gender-toggle">
          <button class="gender-btn active" data-gender="male">👨 Male</button>
          <button class="gender-btn" data-gender="female">👩 Female</button>
        </div>
      </div>

      <div class="studio-product-name" id="studioProductName">Loading...</div>

      <!-- id="canvasOuter" added so JS can target it for scroll on zoom -->
      <div class="canvas-outer" id="canvasOuter">
        <div class="canvas-container" id="canvasContainer">
          <img class="merch-mockup" id="merchMockup" src="" alt="Merch"/>
          <div class="zone" id="printZone"><span>Print Area</span></div>
        </div>
      </div>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOutBtn">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="zoom-btn" id="zoomInBtn">+</button>
        <button class="zoom-btn" id="zoomResetBtn" title="Reset zoom" style="font-size:0.7rem;width:auto;padding:0 8px;">Reset</button>
      </div>

      <div class="canvas-actions">
        <button class="ca-btn" id="undoBtn" disabled>↩ Undo</button>
        <button class="ca-btn" id="redoBtn" disabled>↪ Redo</button>
        <button class="ca-btn" id="clearBtn">✕ Clear All</button>
        <button class="ca-btn danger" id="removeBtn">🗑 Remove Selected</button>
      </div>

    </div>

    <!-- RIGHT: PANEL -->
    <div class="studio-panel">

      <div class="panel-section">
        <div class="panel-label">Selected Merch</div>
        <div class="panel-merch-info">
          <div class="panel-merch-name" id="panelMerchName">—</div>
          <div class="panel-merch-price" id="panelMerchPrice">—</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Designs Applied <span class="design-count" id="designCount">0 / 5</span></div>
        <div class="design-slots" id="designSlots"></div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Jaifore Graphic Designs</div>
        <div class="graphic-grid" id="graphicGrid">
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
          <div class="gd-skeleton"></div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Upload Your Own Design</div>
        <label class="upload-zone" id="uploadZone">
          <input type="file" id="uploadInput" accept="image/*" hidden/>
          <div class="upload-icon">↑</div>
          <div class="upload-text">Click to upload<br/><span>PNG, JPG, SVG — max 5MB</span></div>
        </label>
      </div>

      <div class="panel-section">
        <div class="panel-label">Print Size <span style="color:#aaa;font-weight:400;text-transform:none;letter-spacing:0">(price per design)</span></div>
        <div class="print-size-row" id="printSizeRow"></div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Garment Size</div>
        <div class="size-row">
          <button class="sz-btn" data-size="XS">XS</button>
          <button class="sz-btn" data-size="S">S</button>
          <button class="sz-btn" data-size="M">M</button>
          <button class="sz-btn" data-size="L">L</button>
          <button class="sz-btn" data-size="XL">XL</button>
          <button class="sz-btn" data-size="XXL">XXL</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Design Notes <span style="color:#aaa;font-weight:400">(optional)</span></div>
        <textarea class="design-notes" id="designNotes" placeholder="Any special instructions for the print team..." rows="3"></textarea>
      </div>

      <button class="add-to-cart-btn" id="addToCartBtn">
        Add to Cart — <span id="cartBtnPrice">$0.00</span>
      </button>
      <p class="studio-msg" id="studioMsg"></p>

    </div>
  </main>

<footer class="footer">
  <div class="footer-inner">
    <img class="footer-brand" src="logo/rooted2.jpg"/>
    <div class="footer-copy">© 2026 Jai'fore Media. Worldwide. By Design.</div>
    <div class="footer-legal">
      <a href="privacy-policy.html">Privacy Policy</a>
      <span>·</span>
      <a href="terms-of-service.html">Terms of Service</a>
      <span>·</span>
      <a href="refund-policy.html">Returns & Refunds</a>
    </div>
  </div>
</footer>


  <script src="scripts/currency.js"></script>
  <script src="scripts/header.js"></script>
  <script src="data/cart.js"></script>
  <script src="scripts/configurator.js"></script>
  <script src="scripts/cookie-consent.js"></script>
</body>
</html>
