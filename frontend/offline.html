<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#4a2d7a"/>
  <title>Offline — Jai'fore</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f5f0e8; color: #111; font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    .box { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    p { color: #555; line-height: 1.5; margin: 0 0 1.4rem; }
    button { background: #4a2d7a; color: #fff; border: 0; border-radius: 8px; padding: 0.7rem 1.6rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="logo/rooted2.jpg" alt="Jai'fore"/>
    <h1>Can't reach the server</h1>
    <p>You seem to be offline, or Jai'fore is temporarily unavailable. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
